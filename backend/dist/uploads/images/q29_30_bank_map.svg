<svg width="450" height="300" viewBox="0 0 450 300" xmlns="http://www.w3.org/2000/svg">
  <rect width="450" height="300" fill="#f8fafc"/>
  <!-- Roads Crossroad -->
  <path d="M 0 140 L 450 140" stroke="#64748b" stroke-width="30"/>
  <path d="M 330 0 L 330 300" stroke="#64748b" stroke-width="30"/>
  <path d="M 330 140 L 330 300" stroke="#f1f5f9" stroke-width="24"/>
  <path d="M 0 140 L 450 140" stroke="#f1f5f9" stroke-width="24"/>
  <path d="M 330 0 L 330 140" stroke="#f1f5f9" stroke-width="24"/>
  <!-- Bank Building at bottom left of intersection -->
  <rect x="230" y="165" width="70" height="50" fill="#ffffff" stroke="#0f172a" stroke-width="3" rx="4"/>
  <text x="265" y="200" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#0f172a">銀</text>
  <!-- People asking directions -->
  <circle cx="310" cy="250" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="340" cy="250" r="10" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="310" y1="260" x2="310" y2="290" stroke="#0f172a" stroke-width="2"/>
  <line x1="340" y1="260" x2="340" y2="290" stroke="#0f172a" stroke-width="2"/>
  <line x1="310" y1="270" x2="340" y2="270" stroke="#0f172a" stroke-width="2"/>
</svg>